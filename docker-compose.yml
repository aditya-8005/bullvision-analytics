services:
  backend:
    build:
      context: ./BACKEND
    container_name: bullvision-backend
    env_file:
      - ./BACKEND/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - bullvision-network

  frontend:
    build:
      context: ./FRONTEND
      args:
        VITE_API_BASE_URL: http://localhost:5000
    container_name: bullvision-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bullvision-network

networks:
  bullvision-network: